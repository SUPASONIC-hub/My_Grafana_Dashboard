<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Behavior Analytics Dashboard</title>
    <meta
      name="description"
      content="Grafana 고객 행동 분석 대시보드를 보안 데이터를 제거한 포트폴리오용 인터랙티브 웹 대시보드로 재구성한 프로젝트입니다."
    />
    <link rel="icon" href="./Profile.jpg" />
    <link rel="apple-touch-icon" href="./Profile.jpg" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="grafana-topbar">
      <div class="crumbs">
        <button class="icon-button" type="button" aria-label="Toggle menu">☰</button>
        <span class="grafana-mark">◎</span>
        <span>Dashboards</span>
        <span>Dashboards</span>
        <strong>고객 행동 분석 대시보드(Customer Behavior Analytics Dashboard)</strong>
        <span>View panel</span>
        <span class="star">★</span>
        <span class="badge">Public</span>
      </div>
      <div class="top-actions">
        <label class="search-box" aria-label="Search">
          <span>⌕</span>
          <input type="search" placeholder="Search..." />
          <kbd>ctrl+k</kbd>
        </label>
        <button class="icon-button" type="button" aria-label="Create">＋</button>
        <button class="icon-button" type="button" aria-label="Help">?</button>
        <span class="avatar">H</span>
      </div>
    </header>

    <main>
      <section class="dashboard-toolbar" aria-label="대시보드 제어">
        <div class="variable">
          <span>유저 ID 검색</span>
          <input id="userSearch" type="search" placeholder="Enter value" autocomplete="off" />
        </div>
        <div class="toolbar-actions">
          <button type="button" class="small-button">‹‹</button>
          <button type="button" class="time-range">◷ 2026-05-01 12:00:00 to 2026-07-31 11:59:59</button>
          <button type="button" class="small-button">››</button>
          <button id="refreshButton" type="button" class="small-button">↻ Refresh</button>
          <button type="button" class="share-button">⌯ Share</button>
          <button type="button" class="small-button">✎ Edit</button>
        </div>
      </section>

      <section id="dashboard" class="dashboard-grid" aria-label="Grafana dashboard panels"></section>
    </main>

    <aside class="right-rail" aria-label="Grafana side tools">
      <button type="button" class="icon-button">⇩</button>
      <button type="button" class="icon-button">☷</button>
      <span></span>
      <button type="button" class="icon-button">▣</button>
    </aside>

    <div id="panelView" class="panel-view" hidden>
      <header class="grafana-topbar view-topbar">
        <div class="crumbs">
          <button id="closeView" class="icon-button" type="button" aria-label="Back">‹</button>
          <span class="grafana-mark">◎</span>
          <span>Dashboards</span>
          <span>Dashboards</span>
          <strong>고객 행동 분석 대시보드</strong>
          <span>View panel</span>
        </div>
        <div class="top-actions">
          <button id="viewInspectButton" type="button" class="small-button">Inspect</button>
          <button id="viewCloseButton" type="button" class="share-button">Back</button>
        </div>
      </header>
      <section class="dashboard-toolbar view-toolbar">
        <div class="variable">
          <span>유저 ID 검색</span>
          <input id="viewUserSearch" type="search" placeholder="Enter value" autocomplete="off" />
        </div>
        <div class="toolbar-actions">
          <button type="button" class="time-range">◷ 2026-05-01 12:00:00 to 2026-07-31 11:59:59</button>
          <button type="button" class="small-button">↻ Refresh</button>
          <button type="button" class="share-button">⌯ Share</button>
          <button type="button" class="small-button">✎ Edit</button>
        </div>
      </section>
      <section id="viewPanelSlot" class="view-panel-slot"></section>
    </div>

    <dialog id="inspectDialog" class="inspect-dialog">
      <form method="dialog">
        <header>
          <strong id="inspectTitle">Panel inspect</strong>
          <button type="submit" class="icon-button" aria-label="Close">×</button>
        </header>
      </form>
      <div class="inspect-tabs" role="tablist">
        <button id="queryTab" class="active" type="button">Query</button>
        <button id="jsonTab" type="button">JSON</button>
      </div>
      <pre id="inspectBody"></pre>
    </dialog>

    <template id="panelTemplate">
      <article class="panel">
        <div class="panel-titlebar">
          <h2></h2>
          <div class="panel-actions">
            <button class="panel-menu-button" type="button" aria-label="Panel menu">⋮</button>
          </div>
        </div>
        <div class="panel-body"></div>
      </article>
    </template>

    <script src="./app.js"></script>
  </body>
</html>
